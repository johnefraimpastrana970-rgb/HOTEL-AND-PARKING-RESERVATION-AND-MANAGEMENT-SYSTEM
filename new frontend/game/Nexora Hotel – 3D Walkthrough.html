 const car=(g,x,y,c)=>{sv('rect',{x:x+10,y:y+8,width:W-20,height:H-16,rx:11,fill:c},g);sv('rect',{x:x+15,y:y+22,width:W-30,height:16,rx:4,fill:'rgba(255,255,255,.45)'},g);sv('rect',{x:x+15,y:y+50,width:W-30,height:10,rx:3,fill:'rgba(0,0,0,.25)'},g)},

  if(q.taken)car(g,x,y,q.res?'#2563d6':hex(q.col));

   const pick=()=>{if(sel){sel.g.querySelector('rect').setAttribute('fill','#24493a');sel.g.querySelectorAll('text').forEach(t=>t.setAttribute('fill','#6fd19c'))}sel={q,g};g.querySelector('rect').setAttribute('fill','#2563d6');g.querySelectorAll('text').forEach(t=>t.setAttribute('fill','#fff'));$('pk').textContent='Selected: space '+q.id+(q.k=='ev'?' (EV charging)':q.k=='acc'?' (accessible)':'');$('prs').disabled=false};
   g.onclick=pick;g.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();pick()}};
   sv('text',{x:x+W/2,y:y+H/2+4,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#6fd19c'},g).textContent=q.id;

const mx=$('mm').getContext('2d');function drawMap(){const big=$('mm').classList.contains('big'),s=5,X=x=>(x+32)*s,Z=z=>(z+23)*s;mx.clearRect(0,0,350,290);mx.fillStyle='rgba(212,200,180,.55)';

function loc(){if(P.f==0){if(P.x>10.5&&Math.abs(P.z)<2)return'Elevator';if(P.z<-10)return'Restaurant';if(P.z>10)return P.x>1?'Parking':'Hotel Entrance';return'Lobby & Reception'}

 if(P.x>10.5&&Math.abs(P.z)<2)return'Elevator';if(Math.abs(P.z)<2)return'Guest Hallway';const i=Math.min(3,Math.max(0,Math.floor((P.x+14)/7)));return'Room '+(100+(P.f-1)*8+(P.z>0?4:0)+i+1)}

let welcomed=false,last=performance.now(),acc=0,sy=0,sp2=0;const CURT=[];
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;
 if(active())move(dt);const v=Math.hypot(P.vx,P.vz),bob=Math.sin(P.bt)*.022*Math.min(1,v/3.2);
 const k=Math.min(1,dt*22);sy+=(P.yaw-sy)*k;sp2+=(P.pitch-sp2)*k;P.dip=(P.dip||0)*Math.pow(.0005,dt);const sh=P.shake?(Math.random()-.5)*.006:0,fr=Math.min(1,v/3.2),sway=Math.cos(P.bt*.5)*.012*fr;C.position.set(P.x,P.base+1.5+P.j+bob-P.dip+sh,P.z);C.rotation.set(sp2,sy,sway);const tf=70+(v>3.4?5:0);if(Math.abs(C.fov-tf)>.05){C.fov+=(tf-C.fov)*Math.min(1,dt*6);C.updateProjectionMatrix()}

 CURT.forEach((m,i)=>{m.scale.x=1+.08*Math.sin(t*.0009+i*1.7);m.scale.z=1+.3*Math.sin(t*.0011+i)});
 for(const n of NPCS){const p=n.pts[n.i],dx=p[0]-n.g.position.x,dz=p[1]-n.g.position.z,l=Math.hypot(dx,dz);if(l<.15){n.i=(n.i+1)%n.pts.length;if(n.pts.length==1){const d=Math.hypot(P.x-n.g.position.x,P.z-n.g.position.z),near=d<7&&P.f==0,ta=d<9&&P.f==0?Math.atan2(P.x-n.g.position.x,P.z-n.g.position.z):0;let da=ta-n.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));n.g.rotation.y+=da*Math.min(1,dt*3);n.L.rotation.x=n.R.rotation.x=0;n.AL.rotation.x=Math.sin(t*.002)*.03;n.AR.rotation.x=near?-2.5:Math.sin(t*.002+1)*.03;n.AR.rotation.z=near?Math.sin(t*.012)*.35:0}}else{n.g.position.x+=dx/l*n.sp*dt;n.g.position.z+=dz/l*n.sp*dt;let da=Math.atan2(dx,dz)-n.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));n.g.rotation.y+=da*Math.min(1,dt*6);n.ph+=dt*n.sp*5;const q=Math.sin(n.ph);n.L.rotation.x=q*.55;n.R.rotation.x=-q*.55;n.AL.rotation.x=-q*.4;n.AR.rotation.x=q*.4}}
 if(WAT)WAT.material.map.offset.set(t*.00003,Math.sin(t*.0004)*.05+t*.00005);if(WAT)WAT.material.color.setHSL(.53+.02*Math.sin(t*.001),.7,.45+.05*Math.sin(t*.0025));
 for(const m of TVS){if(m.material.userData.hue)m.material.emissive.setHSL((t*.0002)%1,.7,.4);else if(m.material.userData.on)m.material.emissive.setHSL((t*.0005)%1,.6,.35)}
