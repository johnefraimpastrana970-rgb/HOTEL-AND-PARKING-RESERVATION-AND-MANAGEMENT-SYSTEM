<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Available parking spaces</title>
<style>
:root{--bg:#e7e4dc;--panel:#f6f4ee;--ink:#23272b;--mute:#6a6f73;--asph:#4a4f55;--paint:#f2c230;--free:#cfe8d9;--freeLine:#1f7a4d;--sel:#2563d6;--ev:#1b8a8f;--line:#cbc7bb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d20;--panel:#25282c;--ink:#ecebe6;--mute:#9a9ea2;--asph:#34383d;--free:#24493a;--freeLine:#6fd19c;--line:#3a3e43}}
:root[data-theme="dark"]{--bg:#1b1d20;--panel:#25282c;--ink:#ecebe6;--mute:#9a9ea2;--asph:#34383d;--free:#24493a;--freeLine:#6fd19c;--line:#3a3e43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 1.9rem/1.1 "Arial Narrow","Franklin Gothic Medium",Arial,sans-serif;margin:0 0 4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--mute);margin-bottom:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:2px solid transparent}
.mapwrap{overflow-x:auto;border-radius:8px}
svg{display:block;min-width:620px;width:100%;height:auto}
.slot[tabindex]{cursor:pointer}
.slot[tabindex]:hover rect{stroke-width:4}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:6px;background:var(--sel);color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--paint);outline-offset:2px}
.slot:focus-visible{outline:none}
.slot:focus-visible rect{stroke:var(--sel);stroke-width:4}
</style>
</head>
<body>
<main>
<h1>Available parking spaces</h1>
<p style="color:var(--mute);margin:0 0 16px">Green spaces are free. Spaces with a car are taken.</p>
<section class="panel">
 <div class="bar"><strong id="count"></strong></div>
 <div class="legend">
  <span><i style="background:var(--free);border-color:var(--freeLine)"></i>Free</span>
  <span><i style="background:var(--asph)"></i>Taken</span>
  <span><i style="background:var(--free);border-color:var(--ev)"></i>EV charging</span>
  <span><i style="background:var(--free);border-color:var(--sel)"></i>Accessible</span>
 </div>
 <div class="mapwrap"><svg id="map" viewBox="0 0 720 480" role="img" aria-label="Parking lot map showing free and taken spaces"></svg></div>
 <div class="bar" style="margin:12px 0 0"><span id="pick" aria-live="polite">Click a free space to select it</span><button id="rs" disabled>Reserve this space</button></div>
</section>
</main>
<script>
const NS="http://www.w3.org/2000/svg";
const rows=[{id:"A",y:20},{id:"B",y:160},{id:"C",y:240},{id:"D",y:380}];
const W=62,H=80,X0=50,N=10;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function kind(r,n){if(r==="A"&&n<=2)return"acc";if(r==="D"&&n>=9)return"ev";return"std"}
function car(g,x,y,col){
 el("rect",{x:x+10,y:y+8,width:W-20,height:H-16,rx:11,fill:col},g);
 el("rect",{x:x+15,y:y+22,width:W-30,height:16,rx:4,fill:"rgba(255,255,255,.45)"},g);
 el("rect",{x:x+15,y:y+50,width:W-30,height:10,rx:3,fill:"rgba(0,0,0,.25)"},g);
}
const svg=document.getElementById("map");
el("rect",{x:0,y:0,width:720,height:480,fill:"var(--asph)",rx:8},svg);
[130,350].forEach(y=>el("line",{x1:30,x2:700,y1:y,y2:y,stroke:"#fff","stroke-opacity":.35,"stroke-dasharray":"14 12","stroke-width":2},svg));
el("text",{x:8,y:134,fill:"#fff","font-size":11,opacity:.7},svg).textContent="IN";
el("text",{x:700,y:354,fill:"#fff","font-size":11,opacity:.7,"text-anchor":"end"},svg).textContent="OUT";
const colors=["#c0453a","#d9a441","#3f7fb5","#8d8f94","#e8e6df","#5a8f6a","#7a4f9a"];
let free=0,sel=null;
rows.forEach(row=>{for(let n=1;n<=N;n++){
 const id=row.id+n,x=X0+(n-1)*W,y=row.y,k=kind(row.id,n),taken=Math.random()<0.5;
 const g=el("g",{class:"slot"},svg);
 const stroke=k==="ev"?"var(--ev)":k==="acc"?"var(--sel)":"var(--paint)";
 el("rect",{x:x+1,y:y+1,width:W-2,height:H-2,fill:taken?"transparent":"var(--free)",stroke:taken?"var(--paint)":stroke,"stroke-width":taken?1.5:2.5,"stroke-opacity":taken?.6:1},g);
 if(taken)car(g,x,y,colors[Math.floor(Math.random()*colors.length)]);
 else{free++;g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label','Space '+id+', free');g.addEventListener('click',()=>choose(id,g,x,y,k));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(id,g,x,y,k)}});
  el("text",{x:x+W/2,y:y+H/2+4,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"var(--freeLine)"},g).textContent=id;
  if(k!=="std")el("text",{x:x+W/2,y:y+H/2+22,"text-anchor":"middle","font-size":10,fill:"var(--freeLine)"},g).textContent=k==="ev"?"EV":"♿";
 }
}});
const $=i=>document.getElementById(i);
function count(){$("count").textContent=free+" of "+rows.length*N+" spaces free"}
count();
function paint(o,on){const r=o.g.querySelector("rect");r.setAttribute("fill",on?"var(--sel)":"var(--free)");o.g.querySelectorAll("text").forEach(t=>t.setAttribute("fill",on?"#fff":"var(--freeLine)"));
 const gh=o.g.querySelector(".ghost");if(gh)gh.remove();
 if(on){const c=el("g",{class:"ghost",opacity:.85},o.g);car(c,o.x,o.y,"#fff")}}
function choose(id,g,x,y,k){
 if(sel)paint(sel,false);
 sel={id,g,x,y,k};paint(sel,true);
 $("pick").textContent="Selected: space "+id+(k==="ev"?" (EV charging)":k==="acc"?" (accessible)":"");
 $("rs").disabled=false;
}
$("rs").onclick=()=>{
 const o=sel;if(!o)return;
 o.g.removeAttribute("tabindex");o.g.removeAttribute("role");
 o.g.replaceChildren();
 el("rect",{x:o.x+1,y:o.y+1,width:W-2,height:H-2,fill:"transparent",stroke:"var(--paint)","stroke-width":1.5,"stroke-opacity":.6},o.g);
 car(o.g,o.x,o.y,"#2563d6");
 free--;count();sel=null;$("rs").disabled=true;
 $("pick").textContent="Space "+o.id+" is reserved for you.";
};
</script>
</body>
</html>
