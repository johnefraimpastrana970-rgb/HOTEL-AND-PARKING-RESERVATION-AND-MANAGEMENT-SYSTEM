<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luxury Reception Background</title>
<style>
  :root{ --gold:#e2b36b; --gold2:#f4d9a0; --bronze:#8a5a2c; --dark:#150e09; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--dark);font-family:"Segoe UI",system-ui,sans-serif}
  .scene{position:fixed;inset:0;z-index:0}
  .scene svg{width:100%;height:100%;display:block}
  /* Put your own page content inside .content. It sits on top of the background. */
  .content{position:relative;z-index:1;min-height:100%;pointer-events:none}
  .content > *{pointer-events:auto}
  .caption{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:2;padding:9px 14px;border-radius:10px;
    background:rgba(20,12,6,.7);backdrop-filter:blur(6px);color:#f6e8cf;font-size:14px;pointer-events:none}
  [data-zone]{cursor:pointer}

  /* feature wall */
  .halo{opacity:.55;transition:opacity .6s}
  #wall:hover .halo{opacity:1}
  #wall .blob{transition:filter .6s}
  #wall:hover .blob{filter:brightness(1.18)}
  /* desk */
  .under{opacity:.7;transition:opacity .5s}
  #desk:hover .under{opacity:1}
  .sweep{transform:translateX(-700px);opacity:0}
  #desk:hover .sweep{transform:translateX(1500px);opacity:1;transition:transform 1.8s ease, opacity .3s}
  /* downlights */
  .dl .cone{opacity:.14;transition:opacity .4s}
  .dl .bulb{fill:#ffe9c0;transition:filter .3s}
  .dl:hover .cone{opacity:.7}
  .dl:hover .bulb{filter:drop-shadow(0 0 8px #ffd48a)}
  /* terminals */
  .scr{fill:#09090b;transition:fill .5s}
  .mon:hover .scr{fill:url(#screenOn)}
  /* vases */
  .vase{transition:filter .4s}
  .vase:hover{filter:brightness(1.25) drop-shadow(0 0 12px rgba(255,200,120,.6))}
  /* blossoms */
  #bloom:hover .sway{animation:sway 3.2s ease-in-out infinite}
  .sway{transform-origin:1215px 450px}
  @keyframes sway{50%{transform:rotate(2.2deg)}}
  .bl{transition:opacity .3s}
  #bloom:hover .bl{animation:tw 1.8s ease-in-out infinite}
  @keyframes tw{50%{opacity:.35}}
  /* timber */
  .strip{opacity:.6;transition:opacity .5s}
  .timber:hover .strip{opacity:1}
  .timber:hover .slat{filter:brightness(1.2)}
  .slat{transition:filter .4s}
  .scene svg{animation:lights 2.4s ease-out}
  @keyframes lights{from{filter:brightness(.2)}to{filter:brightness(1)}}
  .cove{animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.55}}
  .amb{animation:tw 4.5s ease-in-out infinite}
  .mote{animation:float var(--t) ease-in-out var(--dl) infinite alternate}
  @keyframes float{from{transform:translate(0,0);opacity:.1}to{transform:translate(var(--dx),-70px);opacity:.75}}
  .ui{opacity:0;fill:#5a3718;transition:opacity .6s .2s}
  .mon:hover .ui{opacity:.85}
  .bell{transform-box:fill-box;transform-origin:50% 100%}
  .bell:hover{animation:ding .5s 2}
  @keyframes ding{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  .plaque{transition:filter .4s}
  #desk:hover .plaque{filter:drop-shadow(0 0 8px rgba(255,210,140,.8))}
  .logo{transition:filter .4s}
  .logo:hover{filter:brightness(1.12) drop-shadow(0 0 16px rgba(255,214,140,.55))}
  .nglow{opacity:.2;transition:opacity .5s}
  .niche:hover .nglow{opacity:.6}
  body.embed-mode .caption{display:none}
  @media (max-width:760px){ .caption{display:none} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>

<!-- Put your own page content here. It sits on top of the background. -->
<div class="content"></div>

<script>
(function(){
  if(new URLSearchParams(window.location.search).has("embed")) document.body.classList.add("embed-mode");
  var NS="http://www.w3.org/2000/svg";
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

  // downlights
  var dg=document.getElementById("downlights");
  [[80,46],[330,64],[590,56],[1000,56],[1260,64],[1510,46]].forEach(function(p){
    var g=el("g",{"class":"dl","data-zone":"Downlights","data-info":"Dimmable warm white"},dg);
    el("polygon",{points:(p[0]-9)+","+p[1]+" "+(p[0]+9)+","+p[1]+" "+(p[0]+110)+",560 "+(p[0]-110)+",560","fill":"url(#beam)","class":"cone"},g);
    el("ellipse",{cx:p[0],cy:p[1],rx:12,ry:5,"class":"bulb"},g);
  });

  // timber slats
  function timber(id,left){
    var g=document.getElementById(id), n=13, w=205;
    for(var i=0;i<n;i++){
      var t0=i/n, t1=(i+1)/n;
      function x(t){return left? t*w : 2000-t*w;}
      function top(t){return left? 95*t : 95*(1-t)*0+95*(1-t);}
      var xa=x(t0), xb=x(t1);
      var ta=left?95*t0:95*(1-t0), tb=left?95*t1:95*(1-t1);
      var ba=left?800-80*t0:800-80*(1-t0), bb=left?800-80*t1:800-80*(1-t1);
      var shade=["#4a2f1d","#5e3c24","#3d2616","#6b4529"][(i*7)%4];
      el("polygon",{points:xa+","+ta+" "+xb+","+tb+" "+xb+","+bb+" "+xa+","+ba,fill:shade,stroke:"#1a0f08","stroke-width":2,"class":"slat"},g);
      el("line",{x1:xa+3,y1:ta+4,x2:xa+3,y2:ba-4,stroke:"#d9a56a","stroke-width":1.5,opacity:.28},g);
    }
    el("rect",{x:left?0:1795,y:0,width:205,height:800,filter:"url(#grain)","clip-path":left?"url(#clipL)":"url(#clipR)",opacity:.55,"pointer-events":"none"},g);
    var ex=left?0:2000, ex2=left?w:2000-w;
    el("path",{d:"M"+ex+" 800L"+ex2+" 720",stroke:"#ffcf86","stroke-width":6,filter:"url(#blurS)","class":"strip"},g);
    el("path",{d:"M"+ex+" 800L"+ex2+" 720",stroke:"#ffe8bd","stroke-width":2,"class":"strip"},g);
  }
  timber("timberL",true); timber("timberR",false);

  // floor perspective grid
  var gr=document.getElementById("grid");
  for(var i=-9;i<=9;i++) el("line",{x1:1000+i*95,y1:742,x2:1000+i*330,y2:900},gr);
  [776,812,860].forEach(function(y){el("line",{x1:0,y1:y,x2:2000,y2:y},gr);});

  // golden blossom branches
  var br=document.getElementById("branches");
  var paths=[
    "M1215 452C1210 380 1190 320 1150 240","M1215 452C1230 370 1270 300 1300 230",
    "M1215 452C1200 400 1160 360 1110 330","M1215 452C1240 400 1290 380 1340 340",
    "M1215 452C1215 360 1225 280 1215 200","M1215 452C1195 420 1140 400 1085 410"
  ];
  var seed=11; function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  paths.forEach(function(d){
    var p=el("path",{d:d,fill:"none",stroke:"#5a3a22","stroke-width":3,"stroke-linecap":"round"},br);
    var L=p.getTotalLength();
    for(var k=0;k<26;k++){
      var pt=p.getPointAtLength(L*(0.25+rnd()*0.75));
      var c=el("circle",{cx:(pt.x+(rnd()-.5)*46).toFixed(1),cy:(pt.y+(rnd()-.5)*46).toFixed(1),r:(2+rnd()*5).toFixed(1),
        fill:["#f4d9a0","#e2b36b","#ffcf86","#c98a52"][Math.floor(rnd()*4)],opacity:(.55+rnd()*.45).toFixed(2),"class":"bl"},br);
      c.style.animationDelay=(rnd()*1.8).toFixed(2)+"s";
      if(k%4===0) c.setAttribute("class","bl amb");
    }
  });

  // 3D logo: extrusion and light follow the pointer
  var lf=document.getElementById("logo3d"), N=8, offs=[], shOff, light;
  function hex(t){var a=[122,82,36],b_=[52,32,14];return "rgb("+a.map(function(v,i){return Math.round(v+(b_[i]-v)*t)}).join(",")+")";}
  function fe(n,a,p){return el(n,a,p||lf);}
  for(var i=1;i<=N;i++){
    offs.push(fe("feOffset",{"in":"SourceAlpha",dx:0,dy:i*.8,result:"o"+i}));
    fe("feFlood",{"flood-color":hex(i/N),result:"f"+i});
    fe("feComposite",{"in":"f"+i,in2:"o"+i,operator:"in",result:"c"+i});
  }
  shOff=fe("feOffset",{"in":"SourceAlpha",dx:6,dy:18,result:"sh0"});
  fe("feGaussianBlur",{"in":"sh0",stdDeviation:5,result:"sh1"});
  fe("feFlood",{"flood-color":"#000","flood-opacity":".6",result:"shf"});
  fe("feComposite",{"in":"shf",in2:"sh1",operator:"in",result:"shadow"});
  fe("feGaussianBlur",{"in":"SourceAlpha",stdDeviation:1.2,result:"bl"});
  var sp=fe("feSpecularLighting",{"in":"bl",surfaceScale:3,specularConstant:1.1,specularExponent:18,"lighting-color":"#fff6dc",result:"spec"});
  light=el("fePointLight",{x:60,y:-40,z:70},sp);
  fe("feComposite",{"in":"spec",in2:"SourceAlpha",operator:"in",result:"specIn"});
  fe("feComposite",{"in":"SourceGraphic",in2:"specIn",operator:"arithmetic",k1:0,k2:1,k3:1,k4:0,result:"face"});
  var mg2=fe("feMerge",{});
  el("feMergeNode",{"in":"shadow"},mg2);
  for(var j=N;j>=1;j--) el("feMergeNode",{"in":"c"+j},mg2);
  el("feMergeNode",{"in":"face"},mg2);
  function tilt(nx,ny){
    var ux=-nx*1.0, uy=.5-ny*.7;
    offs.forEach(function(o,k){o.setAttribute("dx",(ux*(k+1)).toFixed(2));o.setAttribute("dy",(uy*(k+1)).toFixed(2));});
    shOff.setAttribute("dx",(ux*N*1.2).toFixed(1)); shOff.setAttribute("dy",(uy*N*1.8).toFixed(1));
    light.setAttribute("x",(170+nx*700).toFixed(0)); light.setAttribute("y",(-40+ny*300).toFixed(0));
  }
  tilt(0,0);
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    var qx=0,qy=0,pend=false;
    window.addEventListener("pointermove",function(e){
      qx=e.clientX/window.innerWidth-.5; qy=e.clientY/window.innerHeight-.5;
      if(!pend){pend=true;requestAnimationFrame(function(){pend=false;tilt(qx,qy);});}
    });
  }

  // drifting gold dust
  var mg=document.getElementById("motes");
  for(var m=0;m<30;m++){
    var d=el("circle",{cx:(260+rnd()*1480).toFixed(0),cy:(160+rnd()*540).toFixed(0),r:(.8+rnd()*1.8).toFixed(1),fill:"#ffe2a8","class":"mote"},mg);
    d.style.setProperty("--t",(7+rnd()*8).toFixed(1)+"s"); d.style.setProperty("--dl","-"+(rnd()*10).toFixed(1)+"s"); d.style.setProperty("--dx",((rnd()-.5)*50).toFixed(0)+"px");
  }
  // gentle depth: layers shift with the pointer
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    var m1=document.getElementById("main"), m2=document.getElementById("main2"), tx=0, cx=0;
    window.addEventListener("pointermove",function(e){tx=e.clientX/window.innerWidth-.5;});
    (function loop(){
      if(Math.abs(tx-cx)>.0005){
        cx+=(tx-cx)*.07;
        m1.setAttribute("transform","translate("+(200-cx*16).toFixed(2)+" 0)");
        m2.setAttribute("transform","translate("+(200-cx*36).toFixed(2)+" 0)");
      }
      requestAnimationFrame(loop);
    })();
  }

  // caption + events for your own system
  var cap=document.getElementById("caption");
  document.querySelectorAll("[data-zone]").forEach(function(z){
    z.addEventListener("mouseenter",function(){
      var n=z.getAttribute("data-zone");
      cap.innerHTML="<b>"+n+"</b> &middot; "+z.getAttribute("data-info");
      document.dispatchEvent(new CustomEvent("zonehover",{detail:{zone:n}}));
    });
    z.addEventListener("click",function(){document.dispatchEvent(new CustomEvent("zoneclick",{detail:{zone:z.getAttribute("data-zone")}}));});
  });
})();
</script>
