<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parking Lot Background</title>
<style>
  :root{
    --wall1:#1a2a2f; --wall2:#26393f; --brass:#c9a35a; --brass2:#e6c887;
    --asphalt:#2b3033; --line:#d6dbd9; --free:#5fd0a0; --busy:#e2685f; --yellow:#f2c230;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--wall1);font-family:"Segoe UI",system-ui,sans-serif}
  .scene{position:fixed;inset:0;z-index:0}
  .scene svg{width:100%;height:100%;display:block}
  /* Put your own page content inside .content. It sits on top of the background. */
  .content{position:relative;z-index:1;min-height:100%;pointer-events:none}
  .content > *{pointer-events:auto}
  .caption{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:2;padding:9px 14px;border-radius:10px;
    background:rgba(8,18,20,.72);backdrop-filter:blur(6px);color:#f3efe6;font-size:14px;pointer-events:none}
  [data-zone]{cursor:pointer}

  /* ceiling lights */
  .cone{opacity:.22;transition:opacity .4s}
  .tube{fill:#cfe3df;transition:fill .3s}
  .light:hover .cone{opacity:.85}
  .light:hover .tube{fill:#fff}

  /* slots */
  .pad{fill:rgba(255,255,255,.03);stroke:var(--line);stroke-width:3;transition:fill .3s, stroke .3s}
  .ghost{opacity:0;transform:translateY(34px);transition:opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1)}
  .slot.free:hover .pad{fill:rgba(95,208,160,.28);stroke:var(--free)}
  .slot.free:hover .ghost{opacity:1;transform:none}
  .slot.busy:hover .pad{fill:rgba(226,104,95,.25);stroke:var(--busy)}
  .slot .car{transition:transform .35s}
  .slot.busy:hover .car{transform:translateY(-5px)}
  .slot .tl{transition:fill .3s}
  .slot.busy:hover .tl{fill:#ff5a4f}

  /* gate */
  #arm{transform-box:fill-box;transform-origin:right center;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
  #gate:hover #arm{transform:rotate(70deg)}
  .pnl{fill:var(--busy);transition:fill .3s}
  #gate:hover .pnl{fill:var(--free)}

  /* EV charger */
  #ev .bolt{opacity:.25;transition:opacity .3s, filter .3s}
  #ev:hover .bolt{opacity:1;filter:drop-shadow(0 0 8px #7dffc4)}
  #ev .bar{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(.2);transition:transform 1.6s ease}
  #ev:hover .bar{transform:scaleX(1)}

  /* exit door and sign */
  #exit .doorlit{opacity:0;transition:opacity .4s}
  #exit:hover .doorlit{opacity:1}
  #exit .ex{transition:filter .3s}
  #exit:hover .ex{filter:drop-shadow(0 0 10px #5fd0a0)}
  #psign{transition:filter .4s}
  #psign:hover{filter:drop-shadow(0 0 14px #6aa8ff)}
  #psign .swing{transform-box:fill-box;transform-origin:50% 0}
  #psign:hover .swing{animation:sway 2.4s ease-in-out infinite}
  @keyframes sway{50%{transform:rotate(2.5deg)}}

  /* camera */
  #cam .head{transform-box:fill-box;transform-origin:50% 50%;transition:transform .8s ease}
  #cam:hover .head{transform:rotate(-24deg)}
  #cam .led{opacity:.4;animation:blink 1.2s steps(2) infinite}
  #cam:hover .led{opacity:1}
  @keyframes blink{50%{opacity:.1}}

  .pool{fill:#eaf6f2;opacity:.05;transition:opacity .4s}
  .light:hover .pool{opacity:.3}
  .blades{animation:spin 9s linear infinite}
  #fan:hover .blades{animation-duration:1.1s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .beacon{animation:pulse 1.6s ease-in-out infinite}
  #gate:hover .beacon{fill:var(--free);animation:none;filter:drop-shadow(0 0 8px #5fd0a0)}
  @keyframes pulse{50%{opacity:.3}}
  #fire .alarm{transition:fill .3s}
  #fire:hover .alarm{fill:#ff4a40;filter:drop-shadow(0 0 8px #ff4a40)}
  .glow{fill:#5fd0a0;opacity:0;transition:opacity .4s}
  .slot.free:hover .glow,.slot.picked .glow{opacity:.35}
  .badge{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .3s, transform .4s cubic-bezier(.3,1.6,.5,1)}
  .slot.picked .badge{opacity:1;transform:none}
  .slot.picked .ghost{opacity:1;transform:none}
  .slot.picked .pad{fill:rgba(95,208,160,.34);stroke:var(--free)}
  #far,#near{will-change:transform}
  .hud{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:2;display:flex;align-items:center;gap:12px;
    padding:10px 16px;border-radius:12px;background:rgba(8,18,20,.72);backdrop-filter:blur(6px);color:#f3efe6;font-size:14px;pointer-events:none}
  .hud strong{font-size:22px;color:var(--free)}
  .dots{display:flex;gap:5px}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--busy)}
  .dots i.f{background:var(--free)}
  .dots i.p{background:var(--brass2);box-shadow:0 0 6px var(--brass2)}
  @media (max-width:760px){ .caption{display:none} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14222a"/><stop offset="1" stop-color="#2a3f44"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e3438"/><stop offset="1" stop-color="#1b1f22"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf6f2" stop-opacity=".55"/><stop offset="1" stop-color="#eaf6f2" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- structure -->
<g id="far">
  <rect x="-60" width="1720" height="620" fill="url(#wall)"/>
  <rect x="-60" width="1720" height="86" fill="#0c151a"/>
  <rect x="-60" y="86" width="1720" height="8" fill="var(--brass)"/>
  <g stroke="#2b3b42" stroke-width="10"><path d="M-60 34H1660M-60 60H1660"/></g>
  <rect x="-60" y="600" width="1720" height="300" fill="url(#floor)"/>
  <rect x="-60" y="596" width="1720" height="6" fill="var(--yellow)" opacity=".85"/>
  <g stroke="#3a4a50" stroke-width="2" opacity=".7"><path d="M-60 330H1660M-60 470H1660"/></g>

  <!-- pillars -->
  <g>
    <g transform="translate(180 94)"><rect width="70" height="506" fill="#33474d"/><rect y="446" width="70" height="60" fill="var(--yellow)"/><path d="M0 446l70 60M0 480l36 26M34 446l36 30" stroke="#111" stroke-width="10"/><rect x="10" y="150" width="50" height="46" rx="5" fill="var(--brass)"/><text x="35" y="184" text-anchor="middle" font-size="30" font-weight="700" fill="#14222a" font-family="Arial,sans-serif">A</text></g>
    <g transform="translate(765 94)"><rect width="70" height="506" fill="#33474d"/><rect y="446" width="70" height="60" fill="var(--yellow)"/><path d="M0 446l70 60M0 480l36 26M34 446l36 30" stroke="#111" stroke-width="10"/><rect x="10" y="150" width="50" height="46" rx="5" fill="var(--brass)"/><text x="35" y="184" text-anchor="middle" font-size="30" font-weight="700" fill="#14222a" font-family="Arial,sans-serif">B</text></g>
    <g transform="translate(1350 94)"><rect width="70" height="506" fill="#33474d"/><rect y="446" width="70" height="60" fill="var(--yellow)"/><path d="M0 446l70 60M0 480l36 26M34 446l36 30" stroke="#111" stroke-width="10"/><rect x="10" y="150" width="50" height="46" rx="5" fill="var(--brass)"/><text x="35" y="184" text-anchor="middle" font-size="30" font-weight="700" fill="#14222a" font-family="Arial,sans-serif">C</text></g>
  </g>

  <!-- ceiling lights -->
  <g id="lights"></g>

  <!-- hanging P sign -->
  <g id="psign" data-zone="Level P1" data-info="Guest parking, 120 slots">
    <g class="swing">
      <path d="M560 94V190M640 94V190" stroke="#8a969c" stroke-width="3"/>
      <rect x="520" y="190" width="160" height="70" rx="10" fill="#2f6fd0" stroke="#fff" stroke-width="4"/>
      <text x="600" y="243" text-anchor="middle" font-size="46" font-weight="700" fill="#fff" font-family="Arial,sans-serif">P1</text>
    </g>
  </g>

  <!-- camera -->
  <g id="cam" data-zone="Security camera" data-info="24-hour monitoring">
    <rect x="1010" y="94" width="12" height="40" fill="#8a969c"/>
    <g class="head"><rect x="990" y="130" width="70" height="30" rx="8" fill="#e8eded"/><circle cx="1052" cy="145" r="9" fill="#14222a"/></g>
    <circle class="led" cx="1000" cy="138" r="4" fill="#ff4a40"/>
  </g>

  <!-- exit door -->
  <g id="exit" data-zone="Hotel lobby" data-info="Walkway to the hotel entrance">
    <rect x="1470" y="330" width="130" height="270" fill="#0c151a"/>
    <rect class="doorlit" x="1480" y="340" width="110" height="260" fill="#ffe3a3" opacity=".75"/>
    <rect x="1470" y="330" width="130" height="270" fill="none" stroke="var(--brass)" stroke-width="6"/>
    <g class="ex"><rect x="1490" y="270" width="90" height="42" rx="6" fill="#0c151a" stroke="#5fd0a0" stroke-width="3"/>
    <text x="1535" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#5fd0a0" font-family="Arial,sans-serif">EXIT</text></g>
  </g>

  <!-- floor paint: direction arrows and stains -->
  <g fill="var(--line)" opacity=".5">
    <path d="M300 858h90v-14l34 24-34 24v-14h-90z"/><path d="M760 858h90v-14l34 24-34 24v-14h-90z"/><path d="M1220 858h90v-14l34 24-34 24v-14h-90z"/>
  </g>
  <g fill="#000" opacity=".18"><ellipse cx="640" cy="690" rx="38" ry="14"/><ellipse cx="1040" cy="710" rx="30" ry="11"/><ellipse cx="520" cy="880" rx="60" ry="10"/></g>

  <!-- ventilation fan -->
  <g id="fan" data-zone="Ventilation" data-info="Air exchange every 5 minutes">
    <circle cx="470" cy="290" r="52" fill="#0c151a" stroke="#4a5d63" stroke-width="6"/>
    <g class="blades" style="transform-box:fill-box;transform-origin:50% 50%"><path d="M470 290q-8-40 0-44 8 4 0 44zM470 290q40-8 44 0-4 8-44 0zM470 290q8 40 0 44-8-4 0-44zM470 290q-40 8-44 0 4-8 44 0z" fill="#8a969c"/></g>
    <circle cx="470" cy="290" r="7" fill="var(--brass)"/>
  </g>

  <!-- fire safety -->
  <g id="fire" data-zone="Fire safety" data-info="Extinguisher and alarm point">
    <rect x="330" y="360" width="64" height="96" rx="6" fill="#b93128"/>
    <rect x="342" y="372" width="40" height="46" rx="3" fill="#e8eded" opacity=".9"/>
    <path d="M362 380v30M350 395h24" stroke="#b93128" stroke-width="6"/>
    <circle class="alarm" cx="362" cy="436" r="7" fill="#ffd0cc"/>
  </g>
</g>
<g id="near">
  <!-- EV charger -->
  <g id="ev" data-zone="EV charger" data-info="Fast charging, 2 plugs available">
    <rect x="60" y="500" width="80" height="26" fill="#1a2429"/>
    <rect x="70" y="420" width="60" height="160" fill="#1a2429" opacity="0"/>
    <rect x="62" y="330" width="76" height="200" rx="10" fill="#e8eded"/>
    <rect x="72" y="344" width="56" height="70" rx="6" fill="#0c151a"/>
    <path class="bolt" d="M104 352l-18 34h14l-6 22 20-38h-14z" fill="#7dffc4"/>
    <rect x="72" y="428" width="56" height="8" rx="4" fill="#33474d"/><rect class="bar" x="72" y="428" width="56" height="8" rx="4" fill="#7dffc4"/>
    <path d="M100 470q-50 20-30 70" stroke="#14222a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="52" y="526" width="96" height="16" rx="4" fill="#9aa6ab"/>
  </g>

  <!-- parking slots -->
  <g id="slots"></g>

  <!-- barrier gate -->
  <g id="gate" data-zone="Entry gate" data-info="Barrier lifts on valid ticket">
    <rect x="1500" y="740" width="36" height="130" rx="5" fill="#d9dee3"/>
    <rect x="1508" y="754" width="20" height="26" rx="3" class="pnl"/>
    <circle class="beacon" cx="1518" cy="732" r="9" fill="#f2a830"/>
    <rect id="arm" x="1330" y="770" width="170" height="13" rx="3" fill="#e2685f"/>
    <g fill="#fff"><rect x="1352" y="770" width="16" height="13"/><rect x="1386" y="770" width="16" height="13"/><rect x="1420" y="770" width="16" height="13"/></g>
  </g>
</g>
</svg>
</div>

<div class="caption" id="caption" role="status">Hover over a slot, the gate or the charger</div>

<div class="hud" id="hud" role="status"><strong id="hn">0</strong><span id="ht">slots free</span><span class="dots" id="dots"></span></div>

<!-- Put your own page content here. It sits on top of the background. -->
<div class="content"></div>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

  // ceiling lights
  var lg=document.getElementById("lights");
  [260,620,980,1340].forEach(function(x){
    var g=el("g",{"class":"light","data-zone":"Garage lighting","data-info":"Motion-activated LED lights"},lg);
    el("polygon",{points:(x-90)+",100 "+(x+90)+",100 "+(x+190)+",600 "+(x-190)+",600","fill":"url(#beam)","class":"cone"},g);
    el("rect",{x:x-100,y:94,width:200,height:14,rx:4,"class":"tube"},g);
    el("ellipse",{cx:x,cy:810,rx:170,ry:34,"class":"pool"},g);
  });

  // slots: edit this list from your parking data. 1 = occupied, 0 = free
  var slots=[["01",1],["02",0],["03",1],["04",0],["05",0],["06",1],["07",0]];
  var colors=["#c0392b","#2e86c1","#d5dbdb","#566573","#d68910","#7d3c98","#1e8449"];
  var sg=document.getElementById("slots");
  var plates=["NBC 4821","TKM 1037","PQR 7764","LAD 2250","XYZ 9013","GHJ 3586","DFR 6642"];

  function car(g,x,y,fill,cls,lightFill,plate){
    var c=el("g",{"class":cls},g);
    el("rect",{x:x+24,y:y+128,width:22,height:30,rx:5,fill:"#0b0e10"},c);
    el("rect",{x:x+104,y:y+128,width:22,height:30,rx:5,fill:"#0b0e10"},c);
    el("path",{d:"M"+(x+40)+" "+(y+76)+"l14-34h42l14 34z",fill:fill},c);
    el("path",{d:"M"+(x+49)+" "+(y+74)+"l10-26h32l10 26z",fill:"#0b0e10",opacity:.75},c);
    el("rect",{x:x+20,y:y+74,width:110,height:66,rx:14,fill:fill},c);
    el("rect",{x:x+28,y:y+90,width:22,height:12,rx:3,fill:lightFill,"class":"tl"},c);
    el("rect",{x:x+100,y:y+90,width:22,height:12,rx:3,fill:lightFill,"class":"tl"},c);
    el("rect",{x:x+58,y:y+112,width:34,height:14,rx:2,fill:"#f2f2ee"},c);
    if(plate) el("text",{x:x+75,y:y+122.5,"text-anchor":"middle","font-size":8.5,"font-weight":700,fill:"#223","font-family":"Arial,sans-serif"},c).textContent=plate;
    return c;
  }

  slots.forEach(function(s,i){
    var x=190+i*150, y=590, busy=s[1]===1;
    var g=el("g",{"class":"slot "+(busy?"busy":"free"),"data-zone":"Slot "+s[0],"data-state":busy?"occupied":"free"},sg);
    el("rect",{x:x+4,y:y,width:142,height:178,"class":"pad"},g);
    if(busy){ car(g,x,y,colors[i%colors.length],"car","#a8322a",plates[i]); }
    else {
      el("ellipse",{cx:x+75,cy:y+165,rx:62,ry:12,"class":"glow"},g);
      car(g,x,y,"#5fd0a0","ghost","#2f9d72");
      var b=el("g",{"class":"badge"},g);
      el("circle",{cx:x+75,cy:y+40,r:20,fill:"#5fd0a0"},b);
      el("path",{d:"M"+(x+65)+" "+(y+40)+"l7 8 14-16",stroke:"#0c151a","stroke-width":5,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},b);
    }
    el("text",{x:x+75,y:y+205,"text-anchor":"middle","font-size":20,"font-weight":700,fill:"#c9d2d4",opacity:.75,"font-family":"Arial,sans-serif"},g).textContent=s[0];
  });

  // availability HUD
  var dots=document.getElementById("dots"), picked=null;
  function hud(){
    var all=document.querySelectorAll(".slot"), free=0; dots.innerHTML="";
    all.forEach(function(sl){
      var f=sl.getAttribute("data-state")==="free", p=sl.classList.contains("picked");
      if(f&&!p) free++;
      var d=document.createElement("i"); d.className=p?"p":(f?"f":""); dots.appendChild(d);
    });
    document.getElementById("hn").textContent=free;
    document.getElementById("ht").textContent=picked?("free, you chose "+picked):"slots free";
  }
  hud();

  // caption + events for your own system
  var cap=document.getElementById("caption");
  function show(z){
    var state=z.getAttribute("data-state"), name=z.getAttribute("data-zone");
    var extra=state?(state==="free"?"Free, click to choose":"Occupied"):(z.getAttribute("data-info")||"");
    if(z.classList.contains("picked")) extra="Your choice, click to undo";
    cap.innerHTML="<b>"+name+"</b> &middot; "+extra;
    document.dispatchEvent(new CustomEvent("zonehover",{detail:{zone:name,state:state||null}}));
  }
  document.querySelectorAll("[data-zone]").forEach(function(z){
    z.addEventListener("mouseenter",function(){show(z);});
    z.addEventListener("click",function(){
      var name=z.getAttribute("data-zone");
      if(z.getAttribute("data-state")==="free"){
        var was=z.classList.contains("picked");
        document.querySelectorAll(".slot.picked").forEach(function(o){o.classList.remove("picked");});
        if(!was){ z.classList.add("picked"); picked=name; } else { picked=null; }
        hud(); show(z);
        document.dispatchEvent(new CustomEvent("slotselect",{detail:{slot:picked}}));
      }
      document.dispatchEvent(new CustomEvent("zoneclick",{detail:{zone:name}}));
    });
  });

  // gentle depth: layers shift with the pointer
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    var far=document.getElementById("far"), near=document.getElementById("near");
    var tx=0,cx=0;
    window.addEventListener("pointermove",function(e){tx=e.clientX/window.innerWidth-.5;});
    (function loop(){
      cx+=(tx-cx)*.07;
      far.setAttribute("transform","translate("+(-cx*18).toFixed(2)+" 0)");
      near.setAttribute("transform","translate("+(-cx*44).toFixed(2)+" 0)");
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
