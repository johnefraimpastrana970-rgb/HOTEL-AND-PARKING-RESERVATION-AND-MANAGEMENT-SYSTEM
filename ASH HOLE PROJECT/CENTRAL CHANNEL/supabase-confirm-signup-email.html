
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA Verification</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f2f2;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f2f2f2;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#080808;border:1px solid #b8a45a;border-radius:14px;overflow:hidden;">
          <tr>
            <td align="center" style="padding:28px 24px 18px;">
              <img
                src="YOUR_PUBLIC_LOGO_URL"
                alt="NEXORA — Where Comfort Meets Convenience"
                width="180"
                style="display:block;width:180px;max-width:100%;height:auto;border:0;"
              >
            </td>
          </tr>
          <tr>
            <td style="padding:12px 30px 34px;color:#f7f4e9;">
              <h1 style="margin:0 0 16px;text-align:center;font-size:23px;color:#d7c477;">
                Verify Your Email
              </h1>

              <p style="font-size:15px;line-height:1.7;color:#e5e5e5;">
                Welcome to NEXORA. Please use the verification code below to complete your account registration.
              </p>

              <div style="margin:28px 0;padding:22px 12px;text-align:center;background:#171717;border:1px solid #b8a45a;border-radius:10px;">
                <p style="margin:0 0 12px;font-size:12px;letter-spacing:2px;color:#c9b66c;">
                  YOUR VERIFICATION CODE
                </p>
                <p style="margin:0;font-size:32px;font-weight:bold;letter-spacing:8px;color:#f0d982;">
                  {{ .Token }}
                </p>
              </div>

              <p style="font-size:13px;line-height:1.7;color:#c5c5c5;">
                Enter this code on the NEXORA signup page. If you did not request an account, you can ignore this email.
              </p>

              <hr style="border:0;border-top:1px solid #333;margin:26px 0;">

              <p style="margin:0;text-align:center;font-size:11px;line-height:1.7;color:#9d9d9d;">
                NEXORA<br>
                WHERE COMFORT MEETS CONVENIENCE
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
